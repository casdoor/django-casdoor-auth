name: build
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install linters
        run: pip install black ruff

      - name: Run black
        run: black --check casdoor_auth tests

      - name: Run ruff
        run: ruff check casdoor_auth tests

  test:
    name: Test (Python ${{ matrix.python }}, Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            django: '4.2'
          - python: '3.12'
            django: '5.2'
          - python: '3.14'
            django: '6.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: pip install "django~=${{ matrix.django }}.0" .

      - name: Check migrations
        run: python -m django makemigrations --check --dry-run --settings=tests.settings --pythonpath=.

      - name: Run tests
        run: python -m django test --settings=tests.settings --pythonpath=. -v 2

  release:
    name: Release
    needs: [ lint, test ]
    if: github.repository == 'casdoor/django-casdoor-auth' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup
        run: npm install -g semantic-release @semantic-release/github @semantic-release/commit-analyzer @semantic-release/release-notes-generator semantic-release-pypi

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install setuptools
        run: python -m pip install --upgrade setuptools wheel twine

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: npx semantic-release
